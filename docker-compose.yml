version: '3.8'

# PRME Docker Compose — SQLite 单库部署（REQ-DEC-20260926-001）
# PostgreSQL 服务已移除，数据库唯一选型为 SQLite 3.39+ (WAL 模式)。
# 注意：backend 服务需要项目根目录存在 Dockerfile 方可构建（当前未提供）。

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prme-backend
    environment:
      NODE_ENV: production
      SQLITE_DB_PATH: /app/data/database.sqlite
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      CALC_ENGINE_URL: http://calculation-engine:8000
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      LOG_LEVEL: info
      LOG_DIR: /app/logs
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - prme-network
    restart: unless-stopped

  calculation-engine:
    build:
      context: ../calculation-engine
      dockerfile: Dockerfile
    container_name: prme-calc-engine
    ports:
      - "8000:8000"
    networks:
      - prme-network
    restart: unless-stopped

volumes:
  sqlite_data:

networks:
  prme-network:
    driver: bridge
